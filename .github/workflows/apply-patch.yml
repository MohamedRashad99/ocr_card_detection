name: Apply patch
on:
  push:
    branches: [ solix-apply ]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          test -f ocr_final.patch || exit 0
          sha256sum ocr_final.patch
          git apply --binary --exclude='.github/*' ocr_final.patch
          rm ocr_final.patch
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -- . ':!.github'
          git commit -m "Apply Solix OCR changes"
          git push
